# chernabog#456: repository_dispatch latency and per-item concurrency. Temporary.
name: runner-test-dispatch
on:
  repository_dispatch:
    types: [runner-test]
concurrency:
  group: runner-test-${{ github.event.client_payload.item }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  item:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "started $(date -u +%FT%T.%3NZ)"
          echo "ref=$GITHUB_REF sha=$GITHUB_SHA"
          echo '${{ toJSON(github.event.client_payload) }}' | head -c 2000
          sleep "${{ github.event.client_payload.sleep || 0 }}"
