# Written by chernabog (chernabog init, or chernabog ci workflow --write) from
# .chernabog/config.yaml: its ci: section and what its flows declare. Change
# those and write it again rather than editing it; chernabog doctor checks it
# still matches.
#
# Repository secrets: CHERNABOG_TOKEN, a GitHub token of the persona the flows
# act as, and CLAUDE_CODE_OAUTH_TOKEN, from claude setup-token. Never set
# ANTHROPIC_API_KEY: claude would bill it per token.

name: chernabog
on:
  issues:
    types:
      - labeled
  pull_request:
    types:
      - ready_for_review
      - review_requested
  repository_dispatch:
    types:
      - chernabog-phase
  workflow_run:
    types:
      - completed
    workflows:
      - ci
  schedule:
    - cron: 17 */3 * * *
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      items: ${{ steps.plan.outputs.items }}
      max-parallel: ${{ steps.plan.outputs.max-parallel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: plan
        uses: dataquail/chernabog/action@v0.16.0
        with:
          step: plan
          version: 0.16.0
        env:
          GH_TOKEN: ${{ secrets.CHERNABOG_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
  run:
    name: ${{ matrix.flow }} ${{ matrix.item }}
    needs: plan
    if: needs.plan.outputs.items != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max-parallel) }}
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.items) }}
    concurrency:
      group: chernabog-${{ matrix.flow }}-${{ matrix.item }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: dataquail/chernabog/action@v0.16.0
        with:
          step: run
          version: 0.16.0
          flow: ${{ matrix.flow }}
          persona: ${{ matrix.persona }}
          item: ${{ matrix.item }}
        env:
          GH_TOKEN: ${{ secrets.CHERNABOG_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chernabog-${{ matrix.flow }}-${{ matrix.item }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/chernabog-logs
          retention-days: 5
          if-no-files-found: ignore
          include-hidden-files: true
