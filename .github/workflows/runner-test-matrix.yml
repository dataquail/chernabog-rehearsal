# chernabog#456: a plan job's list fanned out with a dynamic matrix. Temporary.
name: runner-test-matrix
on:
  workflow_dispatch:
    inputs:
      items:
        description: JSON list the plan job outputs
        default: "[]"
      guard:
        description: guard the run job with an if on the list
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      items: ${{ steps.plan.outputs.items }}
    steps:
      - id: plan
        env:
          ITEMS: ${{ inputs.items }}
        run: echo "items=$ITEMS" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    if: ${{ !inputs.guard || needs.plan.outputs.items != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.items) }}
    steps:
      - run: echo "item ${{ toJSON(matrix.item) }} at $(date -u +%T)"; sleep 20
