# Temporary probe for dataquail/chernabog#477: can the plan job reserve with GITHUB_TOKEN? Removed afterwards.
name: probe-plan-token
on:
  workflow_dispatch: {}
permissions:
  contents: write
  issues: read
  pull-requests: read
  checks: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - run: |
          set -u +e
          for path in user rate_limit "search/issues?q=repo:$R+is:pr+is:open"; do
            out=$(gh api -i "$path" 2>&1)
            echo "PROBE $path -> $(echo "$out" | grep -iE '^HTTP/|^x-ratelimit-(limit|used|resource)' | tr -d '\r' | tr '\n' ' ') $(echo "$out" | tail -1 | head -c 160)"
          done
