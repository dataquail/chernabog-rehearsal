# chernabog#456: setup time and the test suite on a hosted runner. Temporary.
name: runner-test-cost
on: workflow_dispatch
permissions:
  contents: read
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        cores: [all, "2"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: nproc; free -m; echo "start $(date -u +%T)"
      - uses: actions/checkout@v4
        with:
          repository: dataquail/chernabog
          fetch-depth: 1
      - run: echo "checked out $(date -u +%T)"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}
      - run: |
          start=$(date +%s); bun install --frozen-lockfile >/dev/null; echo "bun install seconds: $(( $(date +%s) - start ))"
      - name: bun run test
        run: |
          start=$(date +%s)
          if [ "${{ matrix.cores }}" = "2" ]; then taskset -c 0,1 bun run test 2>&1 | tail -15; else bun run test 2>&1 | tail -15; fi
          echo "test seconds: $(( $(date +%s) - start )) exit ${PIPESTATUS[0]}"
