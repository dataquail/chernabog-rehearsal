# Temporary probe for dataquail/chernabog#477's questions. Removed afterwards.
name: probe-477
on:
  check_run:
    types: [created, rerequested, requested_action, completed]
  check_suite:
    types: [completed, requested, rerequested]
  repository_dispatch:
    types: [probe-477]
  workflow_dispatch: {}
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          REF: ${{ github.ref }}
          SENDER: ${{ github.event.sender.login }}
          CHECK: ${{ github.event.check_run.name }}
          CHECK_APP: ${{ github.event.check_run.app.slug }}
        run: echo "event=$EVENT action=$ACTION ref=$REF sender=$SENDER check=$CHECK check_app=$CHECK_APP"
  environments:
    if: github.event_name != 'check_run' && github.event_name != 'check_suite'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { role: author, environment: chernabog-author }
          - { role: review, environment: chernabog-review }
    environment: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.CHERNABOG_APP_KEY }}
          ID: ${{ vars.CHERNABOG_APP_ID }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: echo "role=${{ matrix.role }} env=${{ matrix.environment }} event=$EVENT ref=$REF app_id=$ID key_bytes=${#KEY}"
